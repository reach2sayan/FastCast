name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cpp_compiler }} (C++${{ matrix.std }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC builds at C++23 to also exercise the constexpr code path.
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            std: 23
            cmake_args: "-G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release"

          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            std: 20
            cmake_args: "-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release"

          # MSVC uses the default Visual Studio (multi-config) generator.
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            std: 20
            cmake_args: "-A x64"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.c_compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Configure
        run: >
          cmake -B build -S .
          ${{ matrix.cmake_args }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Benchmarks are timing-sensitive, so only run/publish them on Linux.
      # The 'measure' target is still compiled on every platform by the Build
      # step above, which keeps the benchmark code itself building under MSVC.
      - name: Run benchmarks
        if: runner.os == 'Linux'
        working-directory: build
        run: ./measure --benchmark_format=console --benchmark_out=benchmark_results.json

      - name: Upload benchmark results
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}-${{ matrix.c_compiler }}
          path: build/benchmark_results.json
